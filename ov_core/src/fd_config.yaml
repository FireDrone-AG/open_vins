%YAML:1.0
# Logging verbosity: [DEBUG, INFO, WARNING, ERROR]
verbosity: INFO

# Camera settings
camera_index: 6
camera_width: 640      # requested capture width (optional)
camera_height: 512     # requested capture height (optional)
camera_fps: 30         # requested FPS (optional)

# Feature tracking settings
num_pts: 300
num_aruco: 1024
clone_states: 20
fast_threshold: 10
grid_x: 4
grid_y: 3
min_px_dist: 20
knn_ratio: 0.85
do_downsizing: false
use_stereo: false

# Histogram equalization method: [NONE, HISTOGRAM, CLAHE]
histogram_method: HISTOGRAM
